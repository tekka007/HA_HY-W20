set_raw_state:
  name: Set Raw State
  description: >-
    Sends a raw control command to the selected alarm entity.
    Use with caution, values map directly to cloud controlType values.
  target:
    entity:
      domain: alarm_control_panel
      integration: heyitech_alarm
  fields:
    state:
      name: State
      description: Raw control value to send.
      required: true
      selector:
        select:
          options:
            - label: Arm away (1)
              value: 1
            - label: Arm home (2)
              value: 2
            - label: Disarm (3)
              value: 3
